<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Snake and Ladder">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0095D0"/>
      <stop offset="1" stop-color="#009789"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg3)"/>
  <circle cx="120" cy="90" r="120" fill="#ffffff" opacity="0.08"/>
  <!-- Ladder -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95">
    <line x1="180" y1="70" x2="140" y2="330"/>
    <line x1="250" y1="70" x2="210" y2="330"/>
    <line x1="172" y1="120" x2="242" y2="120"/>
    <line x1="164" y1="175" x2="234" y2="175"/>
    <line x1="157" y1="230" x2="227" y2="230"/>
    <line x1="149" y1="285" x2="219" y2="285"/>
  </g>
  <!-- Dice -->
  <rect x="380" y="150" width="130" height="130" rx="24" fill="#ffffff" opacity="0.95"/>
  <g fill="#0095D0">
    <circle cx="415" cy="185" r="12"/>
    <circle cx="475" cy="185" r="12"/>
    <circle cx="445" cy="215" r="12"/>
    <circle cx="415" cy="245" r="12"/>
    <circle cx="475" cy="245" r="12"/>
  </g>
</svg>
